name: Deploy Ochni Angular starter to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "ochni-angular/**"
      - ".github/workflows/deploy-ochni.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ochni-angular/package.json
      - name: Install Angular dependencies
        working-directory: ochni-angular
        run: npm install
      - name: Build Angular app
        working-directory: ochni-angular
        run: npx ng build --configuration production --base-href /traveleas.github.io/ochni-angular/
      - name: Prepare Pages artifact
        run: |
          mkdir -p public-site/ochni-angular
          rsync -a --exclude='.git' --exclude='public-site' ./ public-site/
          cp -a ochni-angular/dist/ochni-angular/browser/. public-site/ochni-angular/
          touch public-site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
